[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "evoquant"
version = "0.1.0"
description = "Universal pair-regime evolution searcher — auditable rebuild"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
]

[project.optional-dependencies]
gui = [
    "gradio>=4.44",
]
dev = [
    "pytest>=8",
    "ruff>=0.4",
    "mypy>=1.10",
    "gradio>=4.44",
]

[project.scripts]
evoquant = "evoquant.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"evoquant.webui" = ["dashboard.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E741"]  # l as OHLC low is idiomatic here

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["evoquant"]
mypy_path = "src"

# Gradio ships no type stubs; relax only the thin UI glue that wraps it.
# The whole engine stays strict.
[[tool.mypy.overrides]]
module = "evoquant.webui.gradio_app"
disallow_untyped_defs = false
warn_return_any = false
